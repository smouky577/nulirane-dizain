<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Нулиране – дизайн</title>
<style>
:root{--bg:#f2f3f0;--panel:#fff;--line:#d5d8d0;--text:#1c2018;--mut:#6b7165;--acc:#d62d20;--sight:#1f6fd1;--ok:#2f7d32;--gun:#555b52;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1210;--panel:#181c19;--line:#2b312c;--text:#e8ebe4;--mut:#8b9386;--acc:#ff4a3a;--sight:#5aa2ff;--ok:#6fcf73;--gun:#9aa294}}
:root[data-theme="dark"]{--bg:#0f1210;--panel:#181c19;--line:#2b312c;--text:#e8ebe4;--mut:#8b9386;--acc:#ff4a3a;--sight:#5aa2ff;--ok:#6fcf73;--gun:#9aa294}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{max-width:1000px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.stage{display:grid;grid-template-columns:1fr 64px;gap:8px;align-items:stretch}
svg{width:100%;height:auto;display:block}
.vs{display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:center}
.vs input{writing-mode:vertical-lr;direction:rtl;height:230px;accent-color:var(--sight)}
.val{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.lab{font-size:11px;color:var(--mut);text-align:center}
.hs{display:flex;align-items:center;gap:12px;margin-top:8px}
.hs input{flex:1;accent-color:var(--acc);height:32px}
.hs div{min-width:90px;text-align:right}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.info div{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.info b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.shots{display:flex;gap:6px;margin:8px 0}
.shots span{flex:1;height:8px;border-radius:4px;background:var(--line)}
.shots span.on{background:var(--ok)}
.btns{display:flex;gap:8px}
button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:15px;font-weight:600;cursor:pointer}
button.p{background:var(--acc);color:#fff;border:0}
.leg{display:flex;gap:16px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.leg i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
</style>
</head>
<body>
<div class="app">
  <div class="card">
    <div class="stage">
      <svg id="sv" viewBox="0 0 860 320" role="img" aria-label="Пушка с оптика, цел и два лъча"></svg>
      <div class="vs">
        <div class="lab">Височина<br>на оптиката</div>
        <input type="range" id="h" min="30" max="90" step="1" value="55">
        <div class="val"><span id="hv">55</span><small> мм</small></div>
      </div>
    </div>
    <div class="hs" style="margin-top:0;margin-bottom:4px"><div class="lab" style="text-align:left">Начална скорост</div><input type="number" id="v0" value="270" min="100" max="600" step="1" style="flex:none;width:100px;height:auto;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--text);font-size:15px;text-align:right"><div class="lab" style="min-width:0;text-align:left">м/с (от хронографа)</div></div>
    <div class="hs" style="margin-top:0;margin-bottom:4px"><div class="lab" style="text-align:left">BC (G1)</div><input type="number" id="bc" value="0.2" min="0.02" max="1" step="0.01" style="flex:none;width:100px;height:auto;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--text);font-size:15px;text-align:right"><div class="lab" style="min-width:0;text-align:left">лб/кв.инч</div></div>
    <div class="hs">
      <div class="lab" style="text-align:left">Нула</div>
      <input type="range" id="z" min="10" max="200" step="5" value="100">
      <div class="val"><span id="zv">100</span><small> м</small></div>
    </div>
    <div class="leg" style="margin-top:6px">
      <span><i style="background:var(--acc)"></i>линия на мерене (оптика) – права</span>
      <span><i style="background:var(--sight)"></i>траектория на куршума от дулото – крива</span>
    </div>
  </div>

  <div class="card">
    <div class="info">
      <div><small class="lab">Пресечна точка</small><b id="p50">0 м</b></div>
      <div><small class="lab">Втора мишена</small><b><span id="z2v">150</span> м</b><input type="range" id="z2" min="10" max="300" step="5" value="150" style="width:100%;accent-color:#e8a317"></div>
      <div><small class="lab">Падение спрямо центъра</small><b id="dr">0 см</b></div>
    </div>
    <p id="st" style="margin:10px 0 0;font-size:13px;color:var(--mut)"></p><div class="shots" id="shots"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="btns"><button id="shot">Изстрел</button><button class="p" id="ok">Запази нулата</button></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
function mk(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||$('sv')).appendChild(e);return e}
function draw(){
  const sv=$('sv');sv.innerHTML='';
  const h=+$('h').value,z=+$('z').value;
  $('hv').textContent=h;$('zv').textContent=z;
  const boreY=215,hs=(h-30)/60*30+22;           // височина на оптиката в пиксели (преувеличена)
  const sightY=boreY-hs;
  const x0=70,xm=250,xt=xm+60+(z/300)*480;       // дуло, цел
  // цев и приклад
  mk('path',{d:`M20 ${boreY-8} h40 l10 -18 h60 l8 18 h112 v12 h-230 l-14 10 h-20 z`,fill:'var(--gun)',opacity:.85});
  mk('rect',{x:70,y:boreY-6,width:xm-70,height:10,rx:3,fill:'var(--gun)'});
  // оптика + стойки
  mk('rect',{x:105,y:sightY-9,width:110,height:18,rx:8,fill:'var(--text)',opacity:.8});
  mk('rect',{x:125,y:sightY+9,width:6,height:boreY-sightY-14,fill:'var(--gun)'});
  mk('rect',{x:190,y:sightY+9,width:6,height:boreY-sightY-14,fill:'var(--gun)'});
  // линия на височината (стрелка към прикладната страна)
  mk('line',{x1:60,y1:sightY,x2:60,y2:boreY,stroke:'var(--sight)','stroke-width':2});
  mk('line',{x1:54,y1:sightY,x2:66,y2:sightY,stroke:'var(--sight)','stroke-width':2});
  mk('line',{x1:54,y1:boreY,x2:66,y2:boreY,stroke:'var(--sight)','stroke-width':2});
  mk('text',{x:72,y:(sightY+boreY)/2+4,fill:'var(--sight)','font-size':13}).textContent=h+' мм';
  // цел
  const tx=xt,ty=boreY;
  [46,34,22,10].forEach((r,i)=>mk('circle',{cx:tx,cy:ty,r,fill:i%2?'var(--panel)':'var(--text)',stroke:'var(--text)','stroke-width':1.5,opacity:i%2?1:.85}));
  mk('rect',{x:tx-3,y:ty+46,width:6,height:boreY+70-ty-46,fill:'var(--gun)'});
  mk('line',{x1:tx,y1:boreY+60,x2:tx,y2:boreY+70,stroke:'var(--mut)'});
  // лъчи
  const xs=xm+170;                               // начало на лъча от оптиката
  mk('line',{x1:112,y1:sightY,x2:215,y2:sightY,stroke:'var(--acc)','stroke-width':3});
  mk('line',{x1:215,y1:sightY,x2:tx,y2:ty,stroke:'var(--acc)','stroke-width':3});
  const v0=+$('v0').value||270,bc=+$('bc').value||0.2,lam=0.0002/bc,tf=x=>(Math.exp(lam*x)-1)/(lam*v0),bh=x=>x*9.81*tf(z)**2/(2*z)-9.81*tf(x)**2/2,pk=3+15*(z/200);
  mk('path',{d:`M${xm} ${boreY} Q${(xm+tx)/2} ${boreY-2*pk} ${tx} ${boreY}`,fill:'none',stroke:'var(--sight)','stroke-width':3});
  const ex=tx+60,cx=(xm+tx)/2,cy=boreY-2*pk,k=(ty-cy)/(tx-cx);       // продължение след целта
  mk('line',{x1:tx,y1:ty,x2:ex,y2:ty+k*(ex-tx),stroke:'var(--sight)','stroke-width':3,'stroke-dasharray':'5 5',opacity:.7});
  mk('line',{x1:xm,y1:boreY,x2:tx,y2:boreY,stroke:'var(--mut)','stroke-width':1,'stroke-dasharray':'2 4'});
  mk('circle',{cx:tx,cy:ty,r:7,fill:'var(--ok)',stroke:'var(--panel)','stroke-width':2});
  const z2=+$('z2').value,tx2=xm+60+(z2/300)*480,dr=(bh(z2)-(h/1000)*(1-z2/z))*100;
  mk('circle',{cx:tx2,cy:boreY,r:34,fill:'none',stroke:'#e8a317','stroke-width':3});
  mk('circle',{cx:tx2,cy:boreY,r:3,fill:'#e8a317'});
  mk('circle',{cx:tx2,cy:boreY-Math.max(-30,Math.min(30,dr*0.6)),r:5,fill:'var(--sight)',stroke:'var(--panel)','stroke-width':1.5});
  mk('text',{x:tx2,y:boreY-44,fill:'#e8a317','font-size':13,'text-anchor':'middle'}).textContent=z2+' м';
  
  const a=0.3;
  [112,208].forEach(xp=>{const py=sightY,sx=-Math.sin(a)*11,sy=Math.cos(a)*11;mk('line',{x1:xp-sx,y1:py-sy,x2:xp+sx,y2:py+sy,stroke:'var(--panel)','stroke-width':3,'stroke-linecap':'round'})});
  mk('text',{x:160,y:sightY-16,fill:'var(--mut)','font-size':12,'text-anchor':'middle'}).textContent='лещи';
  // мащаб
  mk('line',{x1:xm,y1:boreY+62,x2:tx,y2:boreY+62,stroke:'var(--mut)','stroke-width':1.5});
  mk('text',{x:(xm+tx)/2,y:boreY+82,fill:'var(--mut)','font-size':14,'text-anchor':'middle'}).textContent=z+' м';
  // изчисления
  $('z2v').textContent=z2;
  $('dr').textContent=(dr>=0?'+':'')+dr.toFixed(1)+' см'+(Math.abs(dr)<0.05?'':dr<0?' (под)':' (над)');
  
  
  let p50=NaN,pv=null;for(let x=0.5;x<=600;x+=0.5){const f=bh(x)-(h/1000)*(1-x/z);if(pv!==null&&pv*f<0&&Math.abs(x-z)>1.5){p50=x;break}pv=f}
  $('p50').textContent=isNaN(p50)?'—':p50.toFixed(0)+' м';
  $('st').textContent=p50>z?'Къса нула (второто пресичане е на ≈'+p50.toFixed(0)+' м): куршумът още се издига към линията на мерене и я пресича на път нагоре. Кривата почти не личи.':'Дълга нула: куршумът описва лека дъга и пада в центъра (дъгата е схематична, не е в мащаб).';
}
['h','z','z2','v0','bc'].forEach(i=>$(i).addEventListener('input',draw));
let n=0;$('shot').onclick=()=>{const s=$('shots').children;if(n<5)s[n++].classList.add('on');else{n=0;[...s].forEach(x=>x.classList.remove('on'))}};
$('ok').onclick=()=>{$('ok').textContent='Запазено ✓';setTimeout(()=>$('ok').textContent='Запази нулата',1200)};
draw();
</script>
</body>
</html>
